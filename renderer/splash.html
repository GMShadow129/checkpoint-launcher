<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checkpoint Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0c0d10 0%, #17181b 60%, #2a1a1f 100%);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: #e8e8e6;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* El video de fondo (generado con Kling AI). */
    #splash-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Overlay oscuro sutil para que el texto se lea bien. */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.55) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #4dff7c, #ff2a4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 42, 78, 0.3);
      animation: fadeUp 0.8s ease-out 0.3s backwards;
    }

    .version {
      font-size: 11px;
      color: #8a8a86;
      letter-spacing: 1.5px;
      margin-top: 4px;
      animation: fadeUp 0.8s ease-out 0.6s backwards;
    }

    .loading-bar {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 12px;
      animation: fadeUp 0.8s ease-out 0.9s backwards;
    }
    .loading-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #ff2a4e, transparent);
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <video id="splash-video" autoplay muted playsinline>
    <source src="../build/splash.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="container">
    <h1>CHECKPOINT LAUNCHER</h1>
    <div class="loading-bar"></div>
    <div class="version" id="version">v0.5.1-beta.1</div>
  </div>
</body>
</html>
